<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found.">
  <meta name="theme-color" content="#0f172a">
  <title>404 - Page Not Found | Kenneath Kim Gomez</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    .error-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 100px 24px 60px;
    }

    .error-container {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 600px;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-yellow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: clamp(1rem, 1.5vw, 1.1rem);
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <div class="preloader-content">
      <div class="preloader-name">;</div>
      <div class="preloader-bar">
        <div class="preloader-progress"></div>
      </div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-bracket">
          < </span>KK<span class="logo-bracket"></span> />
      </a>
      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- 404 Section -->
  <section class="error-section">
    <div class="hero-bg">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
      <div class="grid-overlay"></div>
    </div>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-message">
        Oops! The page you are looking for seems to have gone missing, or the content is currently unavailable.
      </p>
      <a href="index.html" class="btn btn-primary">
        <i class="fas fa-home"></i>
        Back to Home
      </a>
    </div>
  </section>

  <script src="script.js?v=3"></script>
  <script>
    const errorContainer = document.querySelector('.error-container');
    const errorSection = document.querySelector('.error-section');

    if (errorContainer && errorSection) {

      // 2. Hacker Text Effect for the Title
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
      const title = document.querySelector('.error-title');

      if (title) {
        // Only run on hover
        title.addEventListener('mouseenter', event => {
          let iterations = 0;
          const originalText = title.dataset.value || title.innerText;
          title.dataset.value = originalText;

          clearInterval(title.dataset.interval);

          title.dataset.interval = setInterval(() => {
            title.innerText = title.innerText.split("")
              .map((letter, index) => {
                if (index < iterations) {
                  return originalText[index];
                }
                return letters[Math.floor(Math.random() * letters.length)]
              })
              .join("");

            if (iterations >= originalText.length) {
              clearInterval(title.dataset.interval);
            }

            iterations += 1 / 3;
          }, 30);
        });
      }

      // 3. Interactive Particle Network Background
      const canvas = document.createElement('canvas');
      canvas.id = 'particle-canvas';
      canvas.style.position = 'absolute';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.zIndex = '1';
      canvas.style.pointerEvents = 'none';

      errorSection.insertBefore(canvas, errorContainer);

      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      const mouse = { x: null, y: null, radius: 150 };

      function initParticles() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        const numParticles = Math.floor((width * height) / 10000);
        for (let i = 0; i < numParticles; i++) {
          particles.push(new Particle());
        }
      }

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 2 + 1;
          this.baseX = this.x;
          this.baseY = this.y;
          this.density = (Math.random() * 30) + 1;
          this.vx = (Math.random() - 0.5) * 1.5;
          this.vy = (Math.random() - 0.5) * 1.5;
        }
        draw() {
          ctx.fillStyle = 'rgba(59, 130, 246, 0.6)'; // accent blue
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;

          // Mouse push interaction
          if (mouse.x != null) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < mouse.radius) {
              let forceDirectionX = dx / distance;
              let forceDirectionY = dy / distance;
              let maxDistance = mouse.radius;
              let force = (maxDistance - distance) / maxDistance;
              let directionX = forceDirectionX * force * this.density;
              let directionY = forceDirectionY * force * this.density;

              this.x -= directionX;
              this.y -= directionY;
            }
          }
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();

          for (let j = i; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 120) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(250, 204, 21, ${0.8 - distance / 120})`; // accent yellow
              ctx.lineWidth = 1;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animateParticles);
      }

      window.addEventListener('resize', initParticles);

      errorSection.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });
      errorSection.addEventListener('mouseleave', () => {
        mouse.x = null;
        mouse.y = null;
      });

      initParticles();
      animateParticles();
    }
  </script>
</body>

</html>
